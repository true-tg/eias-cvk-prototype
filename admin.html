<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АІКС «Вибори» • Публічне табло</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка табла -->
    <header>
        <div class="logo-area">
            <h1 id="public-title">АІКС «ВИБОРИ» • Публічне табло</h1>
        </div>
        <div class="status-badge" id="campaign-status">СИСТЕМА ІНІЦІАЛІЗОВАНА (ОЧІКУВАННЯ ДАНИХ)</div>
    </header>

    <!-- Головна робоча зона -->
    <main style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px; align-items: start;">
        
        <!-- Ліва колонка: Динамічний блок результатів кандидатів -->
        <div class="card" id="public-results-container">
            <div class="empty-state">
                НЕМАЄ ЗАРЕЄСТРОВАНИХ КАНДИДАТІВ ТА ПРОТОКОЛІВ
            </div>
        </div>

        <!-- Права колонка: Інтерактивна мапа України -->
        <div class="map-container">
            <svg id="ukraine-map" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
                <!-- Регіони з ідентифікаторами для зв'язку з адмінкою -->
                <path id="UA-32" class="region" data-name="Київська область" d="M350,200 L380,180 L410,210 L390,240 Z" />
                <path id="UA-46" class="region" data-name="Львівська область" d="M120,220 L150,200 L170,230 L140,260 Z" />
                <path id="UA-12" class="region" data-name="Дніпропетровська область" d="M500,280 L550,260 L580,310 L520,330 Z" />
                <path id="UA-80" class="region" data-name="м. Київ" d="M395,215 L405,215 L405,225 L395,225 Z" />
            </svg>
            <div id="map-tooltip" class="tooltip"></div>
        </div>
    </main>

    <!-- Підвал -->
    <footer>
        ЦЕНТРАЛЬНА ВИБОРЧА КОМІСІЯ УКРАЇНИ • АІКС «ВИБОРИ» • ВЕРСІЯ ПРОТОТИПУ 2010
    </footer>

    <!-- Логіка оновлення табла в реальному часі з localStorage -->
    <script>
        function updateTablo() {
            const savedDB = localStorage.getItem('aix_db');
            if (!savedDB) return;

            const db = JSON.parse(savedDB);

            // 1. Оновлюємо назву кампанії в шапці
            const titleElement = document.getElementById('public-title');
            if (titleElement && db.config && db.config.name) {
                titleElement.innerText = `АІКС «ВИБОРИ» • ${db.config.name}`;
            }

            // 2. Оновлюємо статус-бейдж відсотків опрацьованих протоколів
            const statusBadge = document.getElementById('campaign-status');
            if (statusBadge && db.protocols) {
                statusBadge.innerText = `ОПРАЦЬОВАНО ПРОТОКОЛІВ ПО КРАЇНІ: ${db.protocols.globalPercent || '0.00'}%`;
            }

            // 3. Рендеримо список кандидатів та їхні відсотки
            const infoPanel = document.getElementById('public-results-container');
            if (infoPanel && db.candidates) {
                if (db.candidates.length === 0) {
                    infoPanel.innerHTML = '<div class="empty-state">НЕМАЄ ЗАРЕЄСТРОВАНИХ КАНДИДАТІВ ТА ПРОТОКОЛІВ</div>';
                } else {
                    let html = '<h3 style="color: #FFFF00; margin-bottom: 15px; border-bottom: 2px solid #00FFFF; padding-bottom: 5px;">РЕЙТИНГ СУБ'ЄКТІВ</h3>';
                    db.candidates.forEach(c => {
                        let barColor = '#00FFFF';
                        if (c.color === 'leader-zelensky') barColor = '#00FF00';
                        if (c.color === 'leader-poroshenko') barColor = '#FF0000';

                        html += `
                            <div style="background: #000c24; border: 2px solid #00FFFF; padding: 12px; margin-bottom: 10px;">
                                <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px;">
                                    <span style="color: white;">${c.name}</span>
                                    <span style="color: #FFFF00;">${c.percent}%</span>
                                </div>
                                <div style="font-size: 0.8rem; color: #00FFFF; margin-bottom: 8px;">${c.party} (${c.votes} голосів)</div>
                                <div style="width: 100%; background: #002060; height: 16px; border: 1px solid #00FFFF;">
                                    <div style="width: ${c.percent}%; background: ${barColor}; height: 100%;"></div>
                                </div>
                            </div>
                        `;
                    });
                    infoPanel.innerHTML = html;
                }
            }

            // 4. Оновлюємо кольори регіонів на карті
            if (db.regions) {
                for (const regId in db.regions) {
                    const regionElement = document.getElementById(regId);
                    const regInfo = db.regions[regId];

                    if (regionElement && regInfo) {
                        regionElement.setAttribute('data-leader', regInfo.leader);
                        regionElement.setAttribute('data-percent', regInfo.percent);

                        regionElement.classList.remove('leader-zelensky', 'leader-poroshenko', 'leader-blue');
                        if (regInfo.leader) {
                            regionElement.classList.add(regInfo.leader);
                        }
                    }
                }
            }
        }

        // Запускаємо оновлення одразу при завантаженні
        window.onload = updateTablo;

        // Оновлюємо табло автоматично кожну 1 секунду, щоб бачити зміни з адмінки без перезавантаження
        setInterval(updateTablo, 1000);

        // Інтерактивний Tooltip для карти
        const tooltip = document.getElementById('map-tooltip');
        const regions = document.querySelectorAll('.region');

        regions.forEach(region => {
            region.addEventListener('mousemove', (e) => {
                const name = region.getAttribute('data-name');
                const percent = region.getAttribute('data-percent') || '0.00';
                
                tooltip.innerHTML = `<strong>${name}</strong><br/>Результат лідера: ${percent}%`;
                tooltip.style.display = 'block';
                tooltip.style.left = (e.pageX + 15) + 'px';
                tooltip.style.top = (e.pageY - 50) + 'px';
            });

            region.addEventListener('mouseleave', () => {
                tooltip.style.display = 'none';
            });
        });
    </script>
</body>
</html>
